<%@ include file="comunes/navegacion.jsp"%>

<div class="container">
  <div class="text-center" style="margin: 30px">
      <h3>Agregar Empleado</h3>
  </div>
  <form>
    <div class="mb-3">
      <label for="nombre"
             class="form-label">Email address</label>
      <input type="text"
             class="form-control"
             id="nombre"
             required="true">
    </div>

    <div class="mb-3">
      <label for="departamento"
             class="form-label">Departamento</label>
      <input type="text"
             class="form-control"
             id="departamento">
    </div>

    <div class="mb-3">
      <label for="sueldo"
             class="form-label">Sueldo</label>
      <input type="number"
             step="any"
             class="form-control"
             id="sueldo">
    </div>
    <div class="text-center">
      <button type="submit"
              class="btn btn-primary btn-sm me-me">Agregar</button>
      <a href="/empleado" class="btn btn-danger btn-sm">Regresar</a>
    </div>
  </form>
</div>
